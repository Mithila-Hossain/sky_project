{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>

/* Professional page background */
body {
    background: linear-gradient(180deg, #F8FBFF 0%, #EEF4FA 100%);
}

/* Soft floating card */
.schedule-card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    border: 1px solid #E4E9F2;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
}

/* Top accent bar (modern touch) */
.schedule-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 4px;
    width: 100%;
    background: linear-gradient(135deg,
        #0078D4 0%,
        #00AEEF 50%,
        #6A4FBF 100%
    );
}

/* Inputs (cleaner focus style) */
.form-control,
.form-select {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #D6DCE5;
    transition: 0.2s ease;
}

.form-control:focus,
.form-select:focus {
    border-color: #0078D4;
    box-shadow: 0 0 0 4px rgba(0,120,212,0.12);
}

/* Button styling */
.btn-schedule {
    background: #0078D4;
    color: white;
    padding: 10px 22px;
    font-weight: 600;
    border-radius: 10px;
    border: none;
}

.btn-schedule:hover {
    background: #0067b8;
}

</style>

<div class="container py-5" style="max-width: 720px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4" style="gap:10px;">

        <h2 style="font-weight:700; color:#003B70; margin:0; font-size:28px;">
            Schedule Meeting — {{ team.name }}
        </h2>

        <a href="{% url 'team_detail' team.id %}"
           style="text-decoration:none; font-size:14px; color:#0078D4; font-weight:600;">
            ← Back to Team
        </a>

    </div>

    <!-- Card -->
    <div class="schedule-card">

        <form method="POST">
            {% csrf_token %}

            <!-- Date -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">Date & Time</label>
                <input type="datetime-local" name="date_time" class="form-control" required>
            </div>

            <!-- Platform -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">Platform</label>
                <select name="platform" class="form-select" required>
                    <option value="Teams">Microsoft Teams</option>
                    <option value="Zoom">Zoom</option>
                    <option value="Google Meet">Google Meet</option>
                    <option value="In Person">In Person</option>
                </select>
            </div>

            <!-- Agenda -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">Agenda</label>
                <textarea name="agenda" class="form-control" rows="5"
                          placeholder="Meeting agenda..." required></textarea>
            </div>

            <!-- Type -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">Schedule Type</label>
                <select name="schedule_type" class="form-select" required>
                    <option value="One-off">One-off Meeting</option>
                    <option value="Recurring">Recurring Meeting</option>
                </select>
            </div>

            <!-- Button -->
            <div class="d-flex justify-content-end">
                <button class="btn-schedule">
                    Schedule Meeting
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
