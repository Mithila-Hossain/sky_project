{% extends 'base.html' %}
{% load static %}

{% block content %}

<style>
    
    body {
        background: linear-gradient(180deg, #F8FBFF 0%, #EEF4FA 100%);
    }

    .email-card {
        background: white;
        border-radius: 18px;
        padding: 28px;
        border: 1px solid #E4E9F2;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        position: relative;
        overflow: hidden;
    }

    .email-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 4px;
        width: 100%;
        background: linear-gradient(135deg,
            #0078D4 0%,
            #00AEEF 50%,
            #6A4FBF 100%
        );
    }

    /* Input fields */
    .form-control {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #D6DCE5;
    }

    .form-control:focus {
        border-color: #0078D4;
        box-shadow: 0 0 0 4px rgba(0,120,212,0.12);
    }

    /* Button */
    .btn-send {
        background: #0078D4;
        color: white;
        padding: 10px 22px;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .btn-send:hover {
        background: #0067b8;
    }

</style>

<div class="container py-5" style="max-width: 720px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">

        <h1 style="font-weight:700; font-size:28px; color:#003B70; margin:0;">
            Email {{ team.name }}
        </h1>

        <a href="{% url 'team_detail' team.id %}"
           style="text-decoration:none; font-size:14px; color:#0078D4; font-weight:600;">
            ← Back to Team
        </a>

    </div>

    <!-- card -->
    <div class="email-card">

        <form method="POST">
            {% csrf_token %}

            <!-- Subjectss -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">
                    Subject
                </label>

                <input type="text" name="subject" class="form-control"
                       placeholder="Enter subject..." required>
            </div>

            <!-- message -->
            <div class="mb-4">
                <label class="form-label" style="font-weight:700; color:#003B70;">
                    Message
                </label>

                <textarea name="body" class="form-control" rows="7"
                          placeholder="Write your message..." required></textarea>
            </div>

            <!-- Button -->
            <div class="d-flex justify-content-end">
                <button class="btn-send">
                    Send Email
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
