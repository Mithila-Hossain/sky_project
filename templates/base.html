{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Project</title>

    <!-- Bootstrap for layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* Colour palette for the whole project */
        :root {
            --aqua: #4DD0E1;
            --sky-blue: #00AEEF;
            --deep-blue: #0078D4;
            --soft-purple: #9C6ADE;
            --deep-purple: #6A4FBF;

            --cloud-white: #F5F9FF;
            --soft-grey: #E6ECF5;

            /* Gradient styles used across UI */
            --gradient-aqua-blue: linear-gradient(135deg, #4DD0E1, #00AEEF);
            --gradient-blue-purple: linear-gradient(135deg, #00AEEF, #9C6ADE);
            --gradient-aqua-purple: linear-gradient(135deg, #4DD0E1, #6A4FBF);
        }

        /* Page layout setup */
        body {
            margin: 0;
            background-color: var(--cloud-white);
        }

        /* Sidebar navigation */
        .sidebar {
            width: 250px;
            background: linear-gradient(135deg,
            #ff8a00 0%,
            #ff3cac 30%,
            #784ba0 65%,
            #2b86c5 100%
            );
            color: white;
            padding: 20px 15px;
            position: fixed;
            top: 0;
            bottom: 0;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 25px rgba(255, 60, 172, 0.25);
            border-right: 1px solid rgba(255,255,255,0.25);

        }

        /* Sidebar title */
        .sidebar h3 {
            font-weight: bold;
            margin-bottom: 30px;
            color: white;
        }

        /* Sidebar links */
        .sidebar a {
            display: block;
            padding: 12px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 16px;
            transition: 0.25s ease;
        }

        /* Hover effect for sidebar links */
        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.35);
        }


        /* Logout button styling */
        .logout-btn {
            width: 100%;
            background: none;
            border: none;
            color: white;
            text-align: left;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Logout hover effect */
        .logout-btn:hover {
            background: var(--gradient-aqua-blue);
        }

        /* Style for the logo in the sidebar */
       .logo-container {
            display: flex;
            justify-content: center;   /* horizontal center */
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .logo {
            width: 250px;
            height: auto;
        }
        /* content */
        .content {
            margin-left: 250px; /* must match sidebar width */
            width: calc(100% - 250px);
            padding: 30px;
            padding-bottom: 30px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        .sky-footer {
            background: transparent; 
            color: #0078D4;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%; 
            border-radius: 0;
            margin-top: auto; 
            border-top: 1px solid rgba(0,0,0,0.1);
        }
        .sky-footer .footer-left {
            font-size: 14px;
            font-weight: 500;
        }
        
        .sky-footer .footer-right a {
            color: #0078D4; 
            margin-left: 18px;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.9;
            transition: 0.2s ease;
        }
        .sky-footer .footer-right a:hover {
            opacity: 1;
        }




    </style>

</head>

<body>

<!-- Sidebar navigation menu -->
<div class="sidebar">

    <!-- Project logo -->
    <div class="logo-container">
    <img src="{% static 'images/logo2.png' %}" alt="Logo" class="logo">
    </div>

    <!-- Navigation links -->
    <a href="/">Dashboard</a>
    <a href="/teams/">Teams</a>
    <a href="/organisation/">Organisation</a>
    <a href="/messaging/">Messages</a>
    <a href="/schedule/">Schedule</a>
    <a href="/reports/">Reports</a>
    <a href="/visualisation/">Visualisation</a>

    <!-- Logout form (POST required for Django logout) -->
    <form action="{% url 'logout' %}" method="post" style="margin-top:20px;">
        {% csrf_token %}
        <button type="submit" class="logout-btn">
            Logout
        </button>
    </form>

</div>

<!-- Main content area -->
<div class="content">

    {% block content %}
    {% endblock %}

    <footer class="sky-footer">
        <div class="footer-left">
            © 2026 Sky Engineering Portal
        </div>

        <div class="footer-right">
            <a href="#">Terms & Conditions</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Contact</a>
        </div>
    </footer>

</div>


</body>

</html>
