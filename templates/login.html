<!DOCTYPE html>
<html lang="en">
{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Engineering Portal – Sign In</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        /* Color theme used across the login page */
        :root {
            --sky-orange: #ff8a00;
            --sky-pink: #ff3cac;
            --sky-purple: #784ba0;
            --sky-blue: #2b86c5;
        }

        /* Full-page background styling */
        body {
            background: url("{% static 'images/login_page.png' %}") no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Main login container */
        .login-card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.12);
        }

        /* Brand title styling */
        .brand-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            background: linear-gradient(135deg, var(--sky-orange), var(--sky-pink), var(--sky-purple), var(--sky-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        /* Primary submit button */
        .btn-sky {
            background: linear-gradient(135deg, var(--sky-orange), var(--sky-pink), var(--sky-purple), var(--sky-blue));
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn-sky:hover {
            opacity: 0.9;
        }

        /* Social login buttons (if used later) */
        .social-btn {
            width: 48%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
        }

        .social-btn:hover {
            background: #f0f0f0;
        }

        /* Divider text between sections */
        .divider {
            text-align: center;
            margin: 15px 0;
            color: #777;
        }

        /* General link styling */
        a {
            text-decoration: none;
            color: var(--sky-blue);
        }

        a:hover {
            text-decoration: underline;
        }

        /* Special styling for admin login link */
        .admin-link {
            font-weight: 600;
            color: var(--sky-blue);
            position: relative;
            padding-bottom: 3px;
        }

        /* Animated underline effect for admin link */
        .admin-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(
                135deg,
                var(--sky-orange) 0%,
                var(--sky-pink) 30%,
                var(--sky-purple) 65%,
                var(--sky-blue) 100%
            );
            transition: width 0.35s ease;
            border-radius: 2px;
        }

        .admin-link:hover::after {
            width: 100%;
        }
        .errorlist {
            background: #ffe6e6;
            border-left: 4px solid #ff3c3c;
            padding: 10px 14px;
            border-radius: 8px;
            color: #d40101 !important;
            font-weight: 600;
            margin-bottom: 15px;
            list-style: none;
        }
        .errorlist li {
            color: #c40000 !important;
        }

    </style>
</head>

<body>

<!-- Login container -->
<div class="login-card">

    <!-- Application name -->
    <div class="brand-title">Sky Engineering Portal</div>

    <!-- Login form -->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <!-- Submit login button -->
        <button type="submit" class="btn-sky">
            Sign In
        </button>
    </form>

    <!-- Forgot password link -->
    <div class="text-end mt-2">
        <a href="{% url 'password_reset' %}">
            Forgot password?
        </a>
    </div>

    <!-- Admin login shortcut -->
    <div class="text-center mt-3">
        <a href="{% url 'admin_login' %}" class="admin-link">
            Admin Login
        </a>
    </div>

</div>

</body>
</html>
